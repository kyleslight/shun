<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shun Browser Use</title>
  <style>
    body{width:270px;margin:0;padding:18px;background:#1c1c1c;color:#ededed;font:13px system-ui,sans-serif}.title{display:flex;align-items:center;gap:9px;margin-bottom:8px}.title img{width:24px;height:24px}.title h1{margin:0;font-size:15px}p{margin:0;color:#aaa;line-height:1.45}.state{display:flex;align-items:flex-start;gap:8px;margin-top:15px;padding-top:13px;border-top:1px solid #333}.state i{flex:0 0 auto;width:8px;height:8px;margin-top:4px;border-radius:50%;background:#777}.state.connected i{background:#75b58d}.state.connecting i{background:#d6a85f}.state.error i{background:#d77b7b}.state span{min-width:0}.state b{font-size:12px}small{display:block;margin-top:3px;color:#888;line-height:1.4}button{width:100%;margin-top:13px;padding:8px 12px;border:1px solid #444;border-radius:7px;background:#ededed;color:#1c1c1c;font:600 12px system-ui,sans-serif;cursor:pointer}button:hover{background:#fff}button:disabled{cursor:default;opacity:.55}button[hidden]{display:none}
  </style>
</head>
<body>
  <div class="title"><img src="icons/icon-32.png" alt=""><h1>Shun Browser Use</h1></div>
  <p>Lets Shun control a Chrome tab while a task is running. Debugging detaches automatically when the run ends.</p>
  <div class="state" id="state"><i></i><span><b id="label">Checking…</b><small id="detail"></small></span></div>
  <button id="connect" type="button" hidden>Connect to Shun</button>
  <script src="popup.js"></script>
</body>
</html>
