<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'" />
    <title>Regex Tester</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="app">
      <label class="field">
        <span>Pattern</span>
        <input id="pattern" autocomplete="off" spellcheck="false" placeholder="(?<word>[a-z]+)-\d+" />
      </label>
      <label class="field flags">
        <span>Flags</span>
        <input id="flags" autocomplete="off" spellcheck="false" value="g" />
      </label>
      <label class="field">
        <span>Sample text</span>
        <textarea id="sample" spellcheck="false" placeholder="Paste text to test against…"></textarea>
      </label>
      <section id="result" aria-live="polite"></section>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
