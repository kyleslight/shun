name = "shun-registry"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# A dedicated subdomain rather than a path on shunagent.com: the marketing site
# is a static-assets worker with no runtime code, and a route pattern sharing
# that host would have to fight the assets worker for every request.
routes = [{ pattern = "api.shunagent.com", custom_domain = true }]

# Package archives are content-addressed, so an upload never overwrites bytes a
# client may already have verified.
[[r2_buckets]]
binding = "ARCHIVES"
bucket_name = "shun-marketplace"

# Metadata, review state, and the published projection. Bytes stay in R2.
[[d1_databases]]
binding = "DB"
database_name = "shun-marketplace"
database_id = "4f3b4313-b597-4242-8611-59340afc83a7"

# Secrets, set with `wrangler secret put`:
#   OPERATOR_TOKEN  publishes, review decisions, and yanks
#   EMAIL_PEPPER    peppers publisher email hashes

[vars]
ENV = "production"

[observability]
enabled = true
