name: Build Shun CLI artifacts
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (leave empty to use package.json)
        required: false
        type: string
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: ubuntu-24.04
            target: linux-x64
          - os: windows-2022
            target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Select release version
        env:
          SHUN_BUILD_VERSION: ${{ inputs.version }}
        run: node scripts/cli-build-version.mjs
      - run: pnpm test:host
      - run: pnpm typecheck
      - run: pnpm package:cli
      - uses: actions/upload-artifact@v4
        with:
          name: shun-cli-${{ matrix.target }}
          path: release-cli/*
          if-no-files-found: error
